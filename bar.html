<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Planning Bar — Grey Corner</title>
  <link rel="icon" type="image/jpeg" href="LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="global.css" />
  <script src="shared.js"></script>
</head>

<body>
  <div class="grain"></div>
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <!-- Alert -->
  <div id="alert-box">
    <span id="alert-text"></span>
    <button id="alert-close" onclick="GC.hideAlert()">✕</button>
  </div>

  <div id="toast"></div>

  <!-- Modal PIN Manager (1975) -->
  <div class="modal-overlay" id="pinModal" onclick="handleBackdropClick(event)">
    <div class="pin-panel" id="pinPanel">
      <button class="modal-close" style="position:absolute; top:12px; right:14px;" onclick="closePinModal()" title="Fermer">✕</button>
      <div class="pin-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h3 class="pin-title">Accès Générateur</h3>
      <p class="pin-sub">Saisissez le code PIN Admin (<strong>1975</strong>) pour ouvrir le générateur.</p>

      <div class="pin-dots" id="mPinDots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="pin-error" id="mPinError"></div>

      <div class="pin-pad">
        <button class="pin-key" onclick="pressPin('1')">1</button>
        <button class="pin-key" onclick="pressPin('2')">2</button>
        <button class="pin-key" onclick="pressPin('3')">3</button>
        <button class="pin-key" onclick="pressPin('4')">4</button>
        <button class="pin-key" onclick="pressPin('5')">5</button>
        <button class="pin-key" onclick="pressPin('6')">6</button>
        <button class="pin-key" onclick="pressPin('7')">7</button>
        <button class="pin-key" onclick="pressPin('8')">8</button>
        <button class="pin-key" onclick="pressPin('9')">9</button>
        <button class="pin-key func" onclick="clearPin()">⌫</button>
        <button class="pin-key" onclick="pressPin('0')">0</button>
        <button class="pin-key func enter" onclick="submitPin()">↵</button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="fade-up" style="animation-delay:.0s">
    <div class="logo-wrap">
      <img src="LOGO.jpg" alt="Grey Corner" onerror="this.src='https://ui-avatars.com/api/?name=GC&background=faf7f0&color=9c7a3c&size=256'">
    </div>
    <div class="eyebrow">Ravitaillement & Bar</div>
    <h1 class="page-title">Planning <span>Bar</span></h1>
    <p class="page-sub">Organisation du bar et de la mise en place.</p>
    <div class="festive-week-badge" id="festive-badge">✨ Chargement...</div>
    <div class="gold-rule"></div>
    <div class="header-actions">
      <a href="index.html" class="back-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
        Retour Menu
      </a>
      <button onclick="openPinModal()" class="admin-btn" title="Générateur Bar (Admin)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.4" style="width:11px; height:11px;"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        Générateur
      </button>
    </div>
  </header>

  <!-- Content -->
  <div class="container" id="planning-container">
    <div style="padding: 10px 0;">
      <div class="shimmer-skeleton"></div>
      <div class="shimmer-skeleton" style="opacity:0.75;"></div>
      <div class="shimmer-skeleton" style="opacity:0.5;"></div>
    </div>
  </div>

  <footer class="footer">
    Grey Corner · Fès, Maroc
  </footer>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/1mfwB4zNHS79YsNH4vTMUGOdWeQwC3htMgPtDWsrMbWg/gviz/tq?tqx=out:csv&gid=294813093";

    const DEFAULT_H_MATIN = "06:30 – 14:30";
    const DEFAULT_H_SOIR  = "14:15 – Fin service";

    const ACCENTS = [
      "var(--acc-1)", // Lundi : Sunset Corail
      "var(--acc-2)", // Mardi : Vert Émeraude
      "var(--acc-3)", // Mercredi : Bleu Azur
      "var(--acc-4)", // Jeudi : Violet Pourpre
      "var(--acc-5)", // Vendredi : Rose Rubis
      "var(--acc-6)", // Samedi : Ambre Solaire
      "var(--acc-7)"  // Dimanche : Lagon Turquoise
    ];

    /* ── main ── */
    async function init() {
      const container = document.getElementById("planning-container");
      try {
        const resp = await fetch(SHEET_URL, { cache: "no-store" });
        const text = await resp.text();

        if (GC.isHtml(text)) {
          container.innerHTML = `<div class="empty-state">Accès refusé — feuille non publique.</div>`;
          GC.showAlert("Gérer l'accès → Toute personne avec le lien (Lecteur).");
          return;
        }

        const rows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r);
        if (rows.length <= 1) { container.innerHTML = `<div class="empty-state">CSV vide.</div>`; return; }

        /* Banner D2 */
        if (rows.length >= 2) {
          const c2 = GC.parseCsvLine(rows[1]);
          while (c2.length < 6) c2.push("");
          const banner = String(c2[3] ?? "").trim();
          if (banner && banner !== "-") GC.showAlert(banner);
        }

        const all = [];
        for (let i = 1; i < rows.length; i++) {
          const c = GC.parseCsvLine(rows[i]);
          while (c.length < 6) c.push("");
          const label = (c[0] ?? "").trim();
          if (label) {
            all.push({
              date: label,
              dateObj: GC.parseDateLabel(label),
              matin: c[1] ?? '',
              soir: c[2] ?? '',
              hMatin: c[4] ?? '',
              hSoir: c[5] ?? ''
            });
          }
        }

        const t0 = GC.todayMidnight();
        const anyParsable = all.some(r => r.dateObj instanceof Date);
        const data = anyParsable ? all.filter(r => r.dateObj && r.dateObj >= t0) : all;

        render(data, t0);

      } catch (e) {
        container.innerHTML = `<div class="empty-state">Erreur réseau / connexion.</div>`;
        GC.showAlert("Vérifiez votre connexion internet.");
      }
    }

    function render(data, t0) {
      const container = document.getElementById("planning-container");
      if (!data.length) {
        container.innerHTML = `<div class="empty-state">Aucun jour à afficher.</div>`;
        return;
      }

      let todayIdx = data.findIndex(r => r.dateObj && GC.sameDay(r.dateObj, t0));
      if (todayIdx === -1) {
        const todayDayName = (GC.FRENCH_DAYS && GC.FRENCH_DAYS[t0.getDay()]) ? GC.FRENCH_DAYS[t0.getDay()].toLowerCase() : '';
        todayIdx = data.findIndex(r => r.date && r.date.toLowerCase().includes(todayDayName));
      }

      container.innerHTML = data.map((j, idx) => {
        const isToday = idx === todayIdx;
        const hMatin  = GC.pickTime(j.hMatin, DEFAULT_H_MATIN);
        const hSoir   = GC.pickTime(j.hSoir,  DEFAULT_H_SOIR);
        const dayNum  = idx % 7;
        const accent  = ACCENTS[dayNum];
        const delay   = (idx * .04).toFixed(2);

        return `
          <div class="day-card ${isToday ? 'is-today' : ''} fade-up"
               data-day="${dayNum}"
               style="--accent:${accent}; animation-delay:${delay}s;"
               ${isToday ? 'id="today-card"' : ''}>

            <div class="card-header">
              <span class="day-name">${GC.escapeHtml(j.date)}</span>
              ${isToday ? `<div class="today-badge"><span class="today-dot"></span>Aujourd'hui</div>` : ''}
            </div>

            <div class="card-body">
              <div class="shift-header matin">
                <span class="shift-icon">☀️</span> Matin
                <span class="shift-time">${GC.escapeHtml(hMatin)}</span>
              </div>
              ${parseStaff(j.matin)}

              <div class="shift-header soir">
                <span class="shift-icon">🌙</span> Soir
                <span class="shift-time">${GC.escapeHtml(hSoir)}</span>
              </div>
              ${parseStaff(j.soir)}
            </div>
          </div>
        `;
      }).join("");

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const el = document.getElementById("today-card");
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
        }
        GC.initTodayFAB();
      }));
    }

    function parseStaff(text) {
      if (!text || text === '-' || !text.trim())
        return `<div class="repos">— Repos —</div>`;

      return text.split(',').map(s => {
        s = s.trim();
        let nom = "", poste = "BAR";

        if (s.includes(':')) {
          const p = s.split(':');
          poste = GC.cleanPoste((p[0] || '').trim()) || "BAR";
          nom   = (p.slice(1).join(':') || '').trim();
        } else if (s.includes('(') && s.includes(')')) {
          nom   = s.substring(0, s.indexOf('(')).trim();
          poste = GC.cleanPoste(s.substring(s.indexOf('(') + 1, s.lastIndexOf(')'))) || "BAR";
        } else {
          nom = s.trim();
          poste = "BAR";
        }

        return `
          <div class="staff-row">
            <div class="poste-badge">${GC.escapeHtml(poste)}</div>
            <div class="staff-name">${GC.escapeHtml(nom)}</div>
          </div>
        `;
      }).join('');
    }

    /* ── MANAGER PIN MODAL (SÉCURISÉ SHA-256) ── */
    let mPinValue = "";

    function openPinModal() {
      if (GC.isSessionAuth("gc_bar_admin")) {
        window.location.href = "generateur.html";
        return;
      }
      const modal = document.getElementById("pinModal");
      if (!modal) return;
      mPinValue = "";
      updateMPinDots();
      const err = document.getElementById("mPinError");
      if (err) err.textContent = "";
      modal.classList.add("active");
    }

    function closePinModal() {
      const modal = document.getElementById("pinModal");
      if (modal) modal.classList.remove("active");
      mPinValue = "";
    }

    function handleBackdropClick(e) {
      if (e.target.id === "pinModal") closePinModal();
    }

    function updateMPinDots() {
      const dots = document.querySelectorAll("#mPinDots .pin-dot");
      dots.forEach((d, i) => d.classList.toggle("filled", i < mPinValue.length));
    }

    function pressPin(digit) {
      if (mPinValue.length >= 4) return;
      mPinValue += digit;
      const err = document.getElementById("mPinError");
      if (err) err.textContent = "";
      updateMPinDots();
      if (mPinValue.length === 4) setTimeout(submitPin, 140);
    }

    function clearPin() {
      mPinValue = "";
      const err = document.getElementById("mPinError");
      if (err) err.textContent = "";
      updateMPinDots();
    }

    async function submitPin() {
      const err = document.getElementById("mPinError");
      const panel = document.getElementById("pinPanel");

      const isValid = await GC.verifyAdminPin(mPinValue);
      if (isValid) {
        GC.setSessionAuth("gc_bar_admin");
        window.location.href = "generateur.html";
      } else {
        if (err) err.textContent = "Code PIN Admin incorrect.";
        if (panel) {
          panel.classList.remove("shake");
          void panel.offsetWidth;
          panel.classList.add("shake");
        }
        mPinValue = "";
        updateMPinDots();
      }
    }

    /* Keyboard support for PIN */
    document.addEventListener("keydown", e => {
      const modal = document.getElementById("pinModal");
      if (!modal || !modal.classList.contains("active")) return;

      if (e.key >= "0" && e.key <= "9") {
        pressPin(e.key);
      } else if (e.key === "Backspace") {
        mPinValue = mPinValue.slice(0, -1);
        updateMPinDots();
      } else if (e.key === "Enter") {
        submitPin();
      } else if (e.key === "Escape") {
        closePinModal();
      }
    });

    init();
  </script>
</body>
</html>
