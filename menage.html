<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planning Ménage — Grey Corner</title>
  <link rel="icon" type="image/jpeg" href="LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="global.css">
  <script src="shared.js"></script>
  
  <style>
    .scroll-mt-24 {
      scroll-margin-top: 5rem;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <!-- ─── HEADER ─── -->
  <header class="fade-up" style="animation-delay: 0s;">
    <div class="logo-wrap">
      <img src="LOGO.jpg" alt="Grey Corner" onerror="this.src='https://ui-avatars.com/api/?name=GC&background=faf7f0&color=9c7a3c&size=256'" />
    </div>
    <div class="eyebrow">Ordre & Entretien</div>
    <h1 class="page-title">Planning <span>Ménage</span></h1>
    <p class="page-sub">Organisation et propreté de l'espace vestiaires.</p>
    <div class="festive-week-badge" id="festive-badge">✨ Chargement...</div>
    <div class="gold-rule"></div>
    <div class="header-actions">
      <a href="index.html" class="back-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
        Retour Menu
      </a>
    </div>
  </header>

  <div class="container">
    <!-- ONGLETS SEMAINE 01 / SEMAINE 02 -->
    <div class="tabs-wrapper fade-up" style="animation-delay: 0.07s;">
      <button class="tab-btn active" onclick="switchWeek('S1')">Semaine 01</button>
      <button class="tab-btn" onclick="switchWeek('S2')">Semaine 02</button>
    </div>

    <!-- LISTE DES JOURS -->
    <main class="fade-up" style="animation-delay: 0.12s; display: flex; flex-direction: column; gap: 16px;" id="planning-list">
      <!-- Rempli dynamiquement par JavaScript -->
    </main>
  </div>

  <footer class="footer fade-up" style="animation-delay: 0.25s;">
    Grey Corner · Fès, Maroc
  </footer>

  <script>
    const PLANNING_DATA = {
      S1: {
        title: 'Semaine 01',
        schedules: [
          { day: 'lundi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'mardi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'mercredi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'jeudi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'vendredi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'samedi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'dimanche', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
        ]
      },
      S2: {
        title: 'Semaine 02',
        schedules: [
          { day: 'lundi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'mardi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'mercredi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'jeudi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'vendredi', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
          { day: 'samedi', matin: { staff: 'Khadija' }, soir: { staff: 'Nawal' } },
          { day: 'dimanche', matin: { staff: 'Nawal' }, soir: { staff: 'Khadija' } },
        ]
      }
    };

    const ACCENTS = ['var(--acc-1)', 'var(--acc-2)', 'var(--acc-3)', 'var(--acc-4)', 'var(--acc-5)'];
    let currentWeek = 'S1';

    function getTodayLabel() {
      return new Intl.DateTimeFormat('fr-FR', { weekday: 'long' }).format(new Date()).toLowerCase().trim();
    }

    function switchWeek(weekKey) {
      currentWeek = weekKey;
      
      const btns = document.querySelectorAll('.tab-btn');
      if (btns.length >= 2) {
        btns[0].classList.toggle('active', weekKey === 'S1');
        btns[1].classList.toggle('active', weekKey === 'S2');
      }

      // Changement festif dynamique de couleur au clic
      if (weekKey === 'S1') GC.applyFestiveTheme(0);
      else GC.applyFestiveTheme(1);
      
      renderPlanning();
    }

    function renderPlanning() {
      const listContainer = document.getElementById('planning-list');
      const today = getTodayLabel();
      const schedules = PLANNING_DATA[currentWeek].schedules;
      const badge = document.getElementById('festive-badge');
      if(badge) badge.innerText = `✨ ${PLANNING_DATA[currentWeek].title}`;

      listContainer.innerHTML = schedules.map((row, idx) => {
        const isToday = row.day === today;
        const isWE = ['vendredi', 'samedi', 'dimanche'].includes(row.day);
        const accent = ACCENTS[idx % ACCENTS.length];

        return `
          <div class="day-card ${isToday ? 'is-today' : ''} scroll-mt-24" id="day-${row.day}" style="--accent:${accent}">
            <div class="card-header">
              <span class="day-name">${escapeHtml(row.day)}</span>
              ${isToday ? `<div class="today-badge"><span class="today-dot"></span>Aujourd'hui</div>` : ''}
            </div>
            <div class="card-body" style="padding: 10px 16px 14px;">
              
              <div class="shift-row-menage">
                <div class="icon-box-menage">☀️</div>
                <div class="shift-info-box">
                  <div class="shift-label-menage matin">Service Matin • ${isWE ? '06:30 – 14:00' : '06:30 – 12:00'}</div>
                  <div class="staff-name-menage">${escapeHtml(row.matin.staff)}</div>
                </div>
              </div>

              <div class="shift-row-menage">
                <div class="icon-box-menage">🌙</div>
                <div class="shift-info-box">
                  <div class="shift-label-menage soir">Service Soir • ${isWE ? '14:00 – Fin' : '12:00 – Fin'}</div>
                  <div class="staff-name-menage">${escapeHtml(row.soir.staff)}</div>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');

      // Défilement automatique vers le jour courant
      GC.scrollToElement(`day-${today}`, 150);
    }

    // Lancement
    renderPlanning();
  </script>
</body>
</html>
