<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planning Ménage — Grey Corner</title>
  <link rel="icon" type="image/jpeg" href="LOGO.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="global.css?v=20261010-golddays">
  <script src="shared.js?v=20261010-golddays"></script>
  
  <style>
    .scroll-mt-24 {
      scroll-margin-top: 5rem;
    }
    .staff-name-menage[contenteditable="true"] {
      border: 1px dashed var(--brass);
      border-radius: 6px;
      padding: 4px 8px;
      background: #fff;
      outline: none;
      cursor: text;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <div id="alert-box">
    <span id="alert-text"></span>
    <button id="alert-close" onclick="GC.hideAlert()">✕</button>
  </div>

  <div id="toast"></div>

  <!-- Modal PIN Admin Ménage -->
  <div class="modal-overlay" id="pinModal" onclick="handleBackdropClick(event)">
    <div class="pin-panel" id="pinPanel">
      <button class="modal-close" style="position:absolute; top:12px; right:14px;" onclick="closePinModal()" title="Fermer">✕</button>
      <div class="pin-badge">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h3 class="pin-title">Admin Ménage</h3>
      <p class="pin-sub">Saisissez le code PIN Administrateur pour modifier et synchroniser le planning.</p>

      <div class="pin-dots" id="mPinDots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="pin-error" id="mPinError"></div>

      <div class="pin-pad">
        <button class="pin-key" onclick="pressPin('1')">1</button>
        <button class="pin-key" onclick="pressPin('2')">2</button>
        <button class="pin-key" onclick="pressPin('3')">3</button>
        <button class="pin-key" onclick="pressPin('4')">4</button>
        <button class="pin-key" onclick="pressPin('5')">5</button>
        <button class="pin-key" onclick="pressPin('6')">6</button>
        <button class="pin-key" onclick="pressPin('7')">7</button>
        <button class="pin-key" onclick="pressPin('8')">8</button>
        <button class="pin-key" onclick="pressPin('9')">9</button>
        <button class="pin-key func" onclick="clearPin()">⌫</button>
        <button class="pin-key" onclick="pressPin('0')">0</button>
        <button class="pin-key func enter" onclick="submitPin()">↵</button>
      </div>
    </div>
  </div>

  <!-- ─── HEADER ─── -->
  <header class="fade-up" style="animation-delay: 0s;">
    <div class="logo-wrap">
      <img src="LOGO.jpg" alt="Grey Corner" onerror="this.src='https://ui-avatars.com/api/?name=GC&background=faf7f0&color=9c7a3c&size=256'" />
    </div>
    <div class="eyebrow">Ordre & Entretien</div>
    <h1 class="page-title">Planning <span>Ménage</span></h1>
    <p class="page-sub">Organisation et propreté de l'espace vestiaires.</p>
    <div class="festive-week-badge" id="festive-badge">✨ Chargement...</div>
    <div class="gold-rule"></div>
    <div class="header-actions" id="menage-header-actions">
      <a href="index.html" class="back-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
        Retour Menu
      </a>
      <button type="button" id="menageAdminBtn" onclick="openPinModal()" class="admin-btn" title="Mode Édition Admin Ménage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:11px; height:11px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
        Admin
      </button>
    </div>
  </header>

  <div class="container">
    <!-- ONGLETS SEMAINE 01 / SEMAINE 02 -->
    <div class="tabs-wrapper fade-up" style="animation-delay: 0.07s;">
      <button class="tab-btn active" onclick="switchWeek('S1')">Semaine 01</button>
      <button class="tab-btn" onclick="switchWeek('S2')">Semaine 02</button>
    </div>

    <!-- LISTE DES JOURS -->
    <main class="fade-up" style="animation-delay: 0.12s; display: flex; flex-direction: column; gap: 16px;" id="planning-list">
      <!-- Rempli dynamiquement par JavaScript -->
    </main>
  </div>

  <footer class="footer fade-up" style="animation-delay: 0.25s;">
    Grey Corner · Fès, Maroc
  </footer>

  <script>
    const PLANNING_DATA = {
      S1: {
        title: 'Semaine 01',
        schedules: [
          { day: 'lundi', matin: { staff: 'Fouzia' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'mardi', matin: { staff: 'Najia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'mercredi', matin: { staff: 'Hakima' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'jeudi', matin: { staff: 'Edrissia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'vendredi', matin: { staff: 'Hakima / Fouzia' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'samedi', matin: { staff: 'Najia / Edrissia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'dimanche', matin: { staff: 'Hakima / Fouzia' }, soir: { staff: 'Najia / Edrissia' } },
        ]
      },
      S2: {
        title: 'Semaine 02',
        schedules: [
          { day: 'lundi', matin: { staff: 'Najia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'mardi', matin: { staff: 'Fouzia' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'mercredi', matin: { staff: 'Edrissia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'jeudi', matin: { staff: 'Hakima' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'vendredi', matin: { staff: 'Najia / Edrissia' }, soir: { staff: 'Hakima / Fouzia' } },
          { day: 'samedi', matin: { staff: 'Hakima / Fouzia' }, soir: { staff: 'Najia / Edrissia' } },
          { day: 'dimanche', matin: { staff: 'Najia / Edrissia' }, soir: { staff: 'Hakima / Fouzia' } },
        ]
      }
    };

    const ACCENTS = [
      'var(--acc-1)', // Lundi : Sunset Corail
      'var(--acc-2)', // Mardi : Vert Émeraude
      'var(--acc-3)', // Mercredi : Bleu Azur
      'var(--acc-4)', // Jeudi : Violet Pourpre
      'var(--acc-5)', // Vendredi : Rose Rubis
      'var(--acc-6)', // Samedi : Ambre Solaire
      'var(--acc-7)'  // Dimanche : Lagon Turquoise
    ];
    let currentWeek = 'S1';
    let isMenageAdminEdit = false;
    let isMenageSyncing = false;
    let pendingMenageResync = false;
    let autoSyncMenageTimer = null;
    let mPinValue = '';

    function getMenageWebhookUrl() {
      return GC.getWebhookUrl('gc_menage_webhook_url');
    }

    function syncDomToMenageData() {
      const container = document.getElementById('planning-list');
      if (!container || !PLANNING_DATA[currentWeek]) return false;
      let changed = false;
      const fields = container.querySelectorAll('.staff-name-menage[data-idx][data-shift]');
      fields.forEach(el => {
        const idx = parseInt(el.getAttribute('data-idx'), 10);
        const shiftKey = el.getAttribute('data-shift');
        const sched = PLANNING_DATA[currentWeek].schedules[idx];
        if (!sched || !sched[shiftKey]) return;
        const val = String(el.textContent || '').replace(/\s+/g, ' ').trim();
        if (val !== sched[shiftKey].staff) {
          sched[shiftKey].staff = val;
          changed = true;
        }
      });
      if (changed) saveMenageToLocal(true);
      return changed;
    }

    function scheduleAutoSyncMenage() {
      if (autoSyncMenageTimer) clearTimeout(autoSyncMenageTimer);
      autoSyncMenageTimer = setTimeout(() => {
        autoSyncMenageTimer = null;
        if (isMenageAdminEdit && GC.isSessionAuth('gc_menage_admin', 'admin')) {
          syncMenageToCloud({ silent: true });
        }
      }, 1200);
    }

    function mergeMenageData(incoming) {
      if (!incoming || typeof incoming !== 'object') return false;
      let changed = false;
      ['S1', 'S2'].forEach(wk => {
        if (incoming[wk] && Array.isArray(incoming[wk].schedules) && incoming[wk].schedules.length > 0) {
          PLANNING_DATA[wk].schedules = incoming[wk].schedules.map((row, idx) => {
            const fallback = PLANNING_DATA[wk].schedules[idx] || { day: row.day, matin: { staff: '' }, soir: { staff: '' } };
            return {
              day: String(row.day || fallback.day || '').toLowerCase(),
              matin: { staff: String((row.matin && row.matin.staff) ?? fallback.matin.staff) },
              soir: { staff: String((row.soir && row.soir.staff) ?? fallback.soir.staff) }
            };
          });
          changed = true;
        }
      });
      return changed;
    }

    function saveMenageToLocal(markDirty = true) {
      try {
        localStorage.setItem('planningGreyCornerMenageData', JSON.stringify(PLANNING_DATA));
        if (markDirty) localStorage.setItem('gc_menage_dirty', '1');
      } catch (e) {}
    }

    function restoreMenageFromLocal() {
      try {
        const raw = localStorage.getItem('planningGreyCornerMenageData');
        if (!raw) return;
        const parsed = JSON.parse(raw);
        mergeMenageData(parsed);
      } catch (e) {
        console.error('Erreur lecture planning ménage local:', e);
      }
    }

    async function loadMenageFromCloud() {
      const webhookUrl = getMenageWebhookUrl();
      if (!webhookUrl) return;

      const isDirty = localStorage.getItem('gc_menage_dirty') === '1';
      const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 10000) : null;

      try {
        const resp = await fetch(`${webhookUrl}?type=menage&t=${Date.now()}`, {
          redirect: 'follow',
          signal: controller ? controller.signal : undefined
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const json = await resp.json();
        if (json && json.status === 'success' && json.data && (json.data.S1?.schedules?.length || json.data.S2?.schedules?.length)) {
          if (isDirty) {
            GC.showAlert("Des modifications locales Ménage ne sont pas encore synchronisées. Ouvrez Admin > 💾 Enregistrer.");
          } else if (mergeMenageData(json.data)) {
            saveMenageToLocal(false);
            renderPlanning();
          }
        }
      } catch (e) {
        console.warn('Synchro Cloud Ménage indisponible (mode local actif):', e);
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function getTodayLabel() {
      return new Intl.DateTimeFormat('fr-FR', { weekday: 'long' }).format(new Date()).toLowerCase().trim();
    }

    function switchWeek(weekKey) {
      if (isMenageAdminEdit) syncDomToMenageData();
      currentWeek = weekKey;
      
      const btns = document.querySelectorAll('.tab-btn');
      if (btns.length >= 2) {
        btns[0].classList.toggle('active', weekKey === 'S1');
        btns[1].classList.toggle('active', weekKey === 'S2');
      }

      // Changement festif dynamique de couleur au clic
      if (weekKey === 'S1') GC.applyFestiveTheme(0);
      else GC.applyFestiveTheme(1);
      
      renderPlanning();
    }

    function updateMenageStaff(idx, shiftKey, value) {
      if (!PLANNING_DATA[currentWeek] || !PLANNING_DATA[currentWeek].schedules[idx]) return;
      PLANNING_DATA[currentWeek].schedules[idx][shiftKey].staff = String(value || '').replace(/\s+/g, ' ').trim();
      saveMenageToLocal(true);
    }

    function onMenageFieldInput(idx, shiftKey, value) {
      updateMenageStaff(idx, shiftKey, value);
      scheduleAutoSyncMenage();
    }

    function onMenageFieldBlur(idx, shiftKey, value) {
      if (autoSyncMenageTimer) {
        clearTimeout(autoSyncMenageTimer);
        autoSyncMenageTimer = null;
      }
      updateMenageStaff(idx, shiftKey, value);
      if (isMenageAdminEdit && GC.isSessionAuth('gc_menage_admin', 'admin')) {
        syncMenageToCloud({ silent: true });
      }
    }

    function renderPlanning() {
      const listContainer = document.getElementById('planning-list');
      const today = getTodayLabel();
      const schedules = PLANNING_DATA[currentWeek].schedules;
      const badge = document.getElementById('festive-badge');
      if(badge) badge.innerText = `✨ ${PLANNING_DATA[currentWeek].title}`;

      const editAttrs = isMenageAdminEdit ? 'contenteditable="true"' : '';

      listContainer.innerHTML = schedules.map((row, idx) => {
        const isToday = row.day === today;
        const isWE = ['vendredi', 'samedi', 'dimanche'].includes(row.day);
        const dayNum = idx % 7;
        const accent = ACCENTS[dayNum];

        return `
          <div class="day-card ${isToday ? 'is-today' : ''} scroll-mt-24" id="day-${row.day}" data-day="${dayNum}" style="--accent:${accent}">
            <div class="card-header">
              <span class="day-name">${GC.escapeHtml(row.day)}</span>
              ${isToday ? `<div class="today-badge"><span class="today-dot"></span>Aujourd'hui</div>` : ''}
            </div>
            <div class="card-body" style="padding: 10px 16px 14px;">
              
              <div class="shift-row-menage">
                <div class="icon-box-menage">☀️</div>
                <div class="shift-info-box">
                  <div class="shift-label-menage matin">Service Matin • ${isWE ? '06:30 – 14:00' : '06:30 – 12:00'}</div>
                  <div class="staff-name-menage" data-idx="${idx}" data-shift="matin" ${editAttrs} oninput="onMenageFieldInput(${idx}, 'matin', this.textContent)" onblur="onMenageFieldBlur(${idx}, 'matin', this.textContent)">${GC.escapeHtml(row.matin.staff)}</div>
                </div>
              </div>

              <div class="shift-row-menage">
                <div class="icon-box-menage">🌙</div>
                <div class="shift-info-box">
                  <div class="shift-label-menage soir">Service Soir • ${isWE ? '14:00 – Fin' : '12:00 – Fin'}</div>
                  <div class="staff-name-menage" data-idx="${idx}" data-shift="soir" ${editAttrs} oninput="onMenageFieldInput(${idx}, 'soir', this.textContent)" onblur="onMenageFieldBlur(${idx}, 'soir', this.textContent)">${GC.escapeHtml(row.soir.staff)}</div>
                </div>
              </div>

            </div>
          </div>
        `;
      }).join('');

      // Défilement automatique vers le jour courant au milieu de l'écran
      if (!isMenageAdminEdit) {
        GC.scrollToElement(`day-${today}`, 150);
      }
      GC.initTodayFAB();
    }

    function configureMenageWebhook() {
      const current = getMenageWebhookUrl();
      const input = prompt(
        "Entrez l'URL du Webhook Google Apps Script (Web App /exec) pour synchroniser le planning Ménage :",
        current
      );
      if (input === null) return '';
      const cleaned = input.trim();
      if (cleaned) {
        localStorage.setItem('gc_menage_webhook_url', cleaned);
        if (!localStorage.getItem('gc_webhook_url')) {
          localStorage.setItem('gc_webhook_url', cleaned);
        }
        GC.showToast('💾 URL Webhook Ménage enregistrée !');
      }
      return cleaned;
    }

    async function syncMenageToCloud(opts = {}) {
      const silent = !!(opts && opts.silent);
      if (autoSyncMenageTimer) {
        clearTimeout(autoSyncMenageTimer);
        autoSyncMenageTimer = null;
      }
      syncDomToMenageData();

      if (isMenageSyncing) {
        pendingMenageResync = true;
        if (!silent) GC.showToast('⏳ Synchronisation déjà en cours...');
        return;
      }

      const authHash = (opts && opts.authToken) || GC.getAdminAuthToken();
      if (!opts.authToken && !GC.isSessionAuth('gc_menage_admin', 'admin')) {
        if (!silent) {
          alert('Session administrateur expirée. Veuillez vous reconnecter.');
          logoutMenageAdmin();
        }
        return;
      }

      let webhookUrl = getMenageWebhookUrl();
      if (!webhookUrl) {
        if (silent) return;
        webhookUrl = configureMenageWebhook();
        if (!webhookUrl) return;
      }

      saveMenageToLocal(true);
      const syncBtn = document.getElementById('menage-sync-btn');
      const origHtml = syncBtn ? syncBtn.innerHTML : '💾 Enregistrer';
      if (syncBtn && !silent) {
        syncBtn.disabled = true;
        syncBtn.innerHTML = '⏳ Enregistrement...';
      }

      isMenageSyncing = true;
      const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 15000) : null;

      try {
        const resp = await fetch(webhookUrl, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save_menage',
            authHash,
            menageData: PLANNING_DATA
          }),
          signal: controller ? controller.signal : undefined
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const rawText = await resp.text();
        if (GC.isHtml(rawText)) {
          throw new Error("Le Webhook a renvoyé une page HTML (vérifiez les droits d'accès Web App).");
        }
        const json = JSON.parse(rawText);
        if (!json || json.status !== 'success') {
          throw new Error((json && json.message) || 'Confirmation serveur refusée.');
        }
        localStorage.removeItem('gc_menage_dirty');
        GC.hideAlert();
        GC.showToast(silent ? '☁️ Modification Ménage enregistrée sur Google Sheets !' : '☁️ Planning Ménage synchronisé sur Google Sheets !');
      } catch (err) {
        console.error('Erreur sync Ménage:', err);
        if (silent) {
          GC.showToast('⚠️ Sauvegardé localement (Google Sheets hors-ligne).');
        } else {
          GC.showToast('❌ Échec Cloud — Données conservées en local.');
          alert('❌ Échec de synchronisation Ménage :\n' + (err.message || err) + '\n\nVos modifications restent sauvegardées en local.');
        }
      } finally {
        isMenageSyncing = false;
        if (timer) clearTimeout(timer);
        if (syncBtn && !silent) {
          syncBtn.disabled = false;
          syncBtn.innerHTML = origHtml;
        }
        if (pendingMenageResync) {
          pendingMenageResync = false;
          syncMenageToCloud({ silent: true });
        }
      }
    }

    function unlockMenageAdmin() {
      isMenageAdminEdit = true;
      closePinModal();
      const headerActions = document.getElementById('menage-header-actions');
      const adminBtn = document.getElementById('menageAdminBtn');
      if (adminBtn) {
        adminBtn.innerHTML = '✍️ Édition Active';
      }
      if (headerActions && !document.getElementById('menage-sync-btn')) {
        const syncBtn = document.createElement('button');
        syncBtn.id = 'menage-sync-btn';
        syncBtn.type = 'button';
        syncBtn.className = 'back-btn';
        syncBtn.innerHTML = '💾 Enregistrer';
        syncBtn.onclick = () => syncMenageToCloud({ silent: false });
        headerActions.insertBefore(syncBtn, adminBtn);

        const cfgBtn = document.createElement('button');
        cfgBtn.id = 'menage-cfg-btn';
        cfgBtn.type = 'button';
        cfgBtn.className = 'back-btn';
        cfgBtn.innerHTML = '⚙️ Webhook';
        cfgBtn.onclick = configureMenageWebhook;
        headerActions.insertBefore(cfgBtn, adminBtn);

        const outBtn = document.createElement('button');
        outBtn.id = 'menage-logout-btn';
        outBtn.type = 'button';
        outBtn.className = 'logout-btn';
        outBtn.innerHTML = '🔒 Déconnexion';
        outBtn.onclick = logoutMenageAdmin;
        headerActions.appendChild(outBtn);
      }
      renderPlanning();
      GC.showToast('✨ Mode édition Ménage activé — sauvegarde automatique active.');
    }

    function logoutMenageAdmin() {
      if (autoSyncMenageTimer) {
        clearTimeout(autoSyncMenageTimer);
        autoSyncMenageTimer = null;
      }
      syncDomToMenageData();
      if (localStorage.getItem('gc_menage_dirty') === '1') {
        const token = GC.getAdminAuthToken();
        if (token) syncMenageToCloud({ silent: true, authToken: token });
      }
      GC.logout('gc_menage_admin');
      isMenageAdminEdit = false;
      ['menage-sync-btn', 'menage-cfg-btn', 'menage-logout-btn'].forEach(id => document.getElementById(id)?.remove());
      const adminBtn = document.getElementById('menageAdminBtn');
      if (adminBtn) {
        adminBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="width:11px; height:11px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg> Admin`;
      }
      renderPlanning();
      GC.showToast('🔒 Session administrateur Ménage fermée.');
    }

    /* ── MODAL PIN ADMIN MÉNAGE ── */
    function openPinModal() {
      if (isMenageAdminEdit) return;
      if (GC.isSessionAuth('gc_menage_admin', 'admin')) {
        unlockMenageAdmin();
        return;
      }
      const modal = document.getElementById('pinModal');
      if (!modal) return;
      mPinValue = '';
      updateMPinDots();
      const err = document.getElementById('mPinError');
      if (err) err.textContent = '';
      modal.classList.add('active');
    }

    function closePinModal() {
      const modal = document.getElementById('pinModal');
      if (modal) modal.classList.remove('active');
      mPinValue = '';
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'pinModal') closePinModal();
    }

    function updateMPinDots() {
      document.querySelectorAll('#mPinDots .pin-dot').forEach((d, i) => d.classList.toggle('filled', i < mPinValue.length));
    }

    function pressPin(digit) {
      if (mPinValue.length >= 4) return;
      mPinValue += digit;
      const err = document.getElementById('mPinError');
      if (err) err.textContent = '';
      updateMPinDots();
      if (mPinValue.length === 4) setTimeout(submitPin, 140);
    }

    function clearPin() {
      mPinValue = '';
      const err = document.getElementById('mPinError');
      if (err) err.textContent = '';
      updateMPinDots();
    }

    async function submitPin() {
      const err = document.getElementById('mPinError');
      const panel = document.getElementById('pinPanel');
      const lockStatus = GC.getPinLockoutStatus('admin');
      if (lockStatus.locked) {
        if (err) err.textContent = `Trop de tentatives incorrectes. Réessayez dans ${lockStatus.remainingSec}s.`;
        return;
      }
      if (mPinValue.length !== 4) {
        if (err) err.textContent = 'Entrez le code à 4 chiffres.';
        return;
      }
      const isValid = await GC.verifyAdminPin(mPinValue);
      if (isValid) {
        GC.setSessionAuth('gc_menage_admin', 'admin');
        unlockMenageAdmin();
      } else {
        if (err) err.textContent = GC.lastPinError || 'Code PIN Admin incorrect.';
        if (panel) {
          panel.classList.remove('shake');
          void panel.offsetWidth;
          panel.classList.add('shake');
        }
        mPinValue = '';
        updateMPinDots();
      }
    }

    document.addEventListener('keydown', e => {
      const modal = document.getElementById('pinModal');
      if (!modal || !modal.classList.contains('active')) return;
      if (e.key >= '0' && e.key <= '9') pressPin(e.key);
      else if (e.key === 'Backspace') { mPinValue = mPinValue.slice(0, -1); updateMPinDots(); }
      else if (e.key === 'Enter') submitPin();
      else if (e.key === 'Escape') closePinModal();
    });

    // Lancement automatique avec restauration locale + synchro Cloud
    restoreMenageFromLocal();
    const initialWeek = (typeof GC !== 'undefined' && typeof GC.getWeekNumber === 'function' && (GC.getWeekNumber() % 2 === 0)) ? 'S2' : 'S1';
    switchWeek(initialWeek);
    loadMenageFromCloud();
  </script>
</body>
</html>
